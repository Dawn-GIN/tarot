name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jar
        run: |
          cd tarot-api
          mvn clean package -DskipTests -q

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Export Docker images
        run: |
          docker save tarot-ai-backend tarot-ai-frontend | gzip > tarot-images.tar.gz

      - name: Setup env file on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cat > /root/.env.production << 'ENVEOF'
            ${{ secrets.ENV_PRODUCTION }}
            ENVEOF

      - name: Transfer images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "tarot-images.tar.gz,docker-compose.prod.yml"
          target: /root
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root
            docker load < tarot-images.tar.gz
            cp docker-compose.prod.yml docker-compose.yml
            docker compose --env-file .env.production down
            docker compose --env-file .env.production up -d
            docker image prune -f
            rm -f tarot-images.tar.gz docker-compose.prod.yml
            echo "Deploy complete at $(date)"
